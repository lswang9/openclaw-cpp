name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake curl libcurl4-openssl-dev libssl-dev python3 python3-pip python3-venv

      - name: Conan install
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip conan
          conan profile detect --force || true
          conan install . --output-folder=build --build=missing -s build_type=Release -s compiler.cppstd=20

      - name: CMake build
        run: |
          . .venv/bin/activate
          cmake --preset conan-release
          cmake --build --preset conan-release -j$(nproc)

      - name: Self-test
        run: ./build/build/Release/openclaw-cpp self-test

      - name: Integration smoke (mock)
        run: ./scripts/integration-smoke.sh
